[package]
name = "rust-auto-updator"
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/siarheisinelnikau/rust-auto-updator"
description = "UI-independent GitHub release updates for Windows executables and Debian packages"
readme = "README.md"

[features]
smoke-test = []

[dependencies]
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
