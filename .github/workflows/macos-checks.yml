name: macOS experimental checks

on:
  workflow_dispatch:
  push:
    branches: [codex/validate-0.7]
  pull_request:
    # Any Rust change can break the macOS build, so the experimental macOS
    # matrix runs for every pull request that touches sources or dependencies.
    # A Windows-only or Ubuntu-only checkout cannot detect these regressions.
    paths:
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - "packaging/**"
      - "tools/package_macos.py"
      - ".github/workflows/macos-checks.yml"
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: macos-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-checks-${{ matrix.target }}
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo test --locked -p rust-auto-updator --lib --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and verify the application without requesting permissions
        run: python3 tools/package_macos.py --binary target/${{ matrix.target }}/release/desk-switch --out dist
