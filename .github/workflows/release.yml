name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            binary: desk-switch
            rustflags: ""
          - os: windows-2022
            platform: windows
            binary: desk-switch.exe
            rustflags: "-C target-feature=+crt-static"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: desk-switch-${{ matrix.platform }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desk-switch-*
          path: artifacts
          merge-multiple: true
      - name: Prepare the private signing key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.DESK_SWITCH_UPDATE_SIGNING_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = os.environ.get("UPDATE_SIGNING_KEY", "")
          if not key:
              raise SystemExit("Set the DESK_SWITCH_UPDATE_SIGNING_KEY repository secret first")
          path = Path(os.environ["RUNNER_TEMP"]) / "update-signing-key.pem"
          path.write_text(key)
          path.chmod(0o600)
          PY
      - name: Sign one manifest for both platforms
        run: >-
          python3 tools/prepare_release.py --tag "$GITHUB_REF_NAME"
          --linux artifacts/desk-switch --windows artifacts/desk-switch.exe
          --key "$RUNNER_TEMP/update-signing-key.pem" --out dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "Desk Switch $GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing-key.pem"
