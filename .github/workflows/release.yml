name: Release

on:
  push:
    branches: [main]
    paths: [release/publish-request.json]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new version after build and signing checks
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.request.outputs.build }}
      publish: ${{ steps.request.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: request
        env:
          REQUESTED_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('release/publish-request.json').read_text())
          allowed = not request.get('hold', False)
          publish = allowed and os.environ['REQUESTED_PUBLISH'] == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"build={str(allowed).lower()}\npublish={str(publish).lower()}\n")
          print('Release publication is on hold.' if not allowed else 'Release request accepted.')
          PY
  build:
    needs: request
    if: needs.request.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            binary: desk-switch
            rustflags: ""
          - os: windows-2022
            platform: windows
            binary: desk-switch.exe
            rustflags: "-C target-feature=+crt-static"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev dpkg-dev desktop-file-utils python3-gi dbus udev openssl polkitd
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked -p rust-auto-updator --lib
      - if: runner.os == 'Linux'
        run: |
          node tools/test_gnome_companion.mjs
          python3 tools/test_release_assets.py
          python3 tools/test_promote_release.py
          python3 tools/test_normalize_release_assets.py
          python3 tools/test_input_access.py
          python3 tools/test_update_install.py
          udevadm verify packaging/linux/99-desk-switch-input-access.rules
      - run: cargo build --locked --release
      - name: Verify native executable icons and version metadata
        if: matrix.platform == 'windows'
        shell: pwsh
        timeout-minutes: 2
        run: ./tools/verify_windows_icon.ps1 -Executable target/release/desk-switch.exe -ExpectedIcon assets/desk-switch.ico -PngDirectory target/windows-icon-proof
      - if: runner.os == 'Linux'
        run: /usr/bin/python3 tools/test_portal_restore.py --binary target/release/desk-switch
      - if: matrix.platform == 'linux'
        run: |
          python3 tools/package_deb.py --binary target/release/desk-switch --out dist
          python3 tools/verify_deb.py dist/*.deb
          sudo apt-get --simulate install ./dist/*.deb
      - if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desk-switch-${{ matrix.platform }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
      - if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desk-switch-debian
          path: dist/*.deb
          if-no-files-found: error

  build-macos:
    name: build (${{ matrix.os }}, ${{ matrix.target }})
    needs: request
    if: needs.request.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: desk-switch-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: desk-switch-macos-x86-64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo test --locked -p rust-auto-updator --lib --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and verify the application without requesting permissions
        run: python3 tools/package_macos.py --binary target/${{ matrix.target }}/release/desk-switch --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  sign:
    needs: [build, build-macos]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desk-switch-*
          path: artifacts
          merge-multiple: true
      - name: Sign verified installers with the existing updater identity
        env:
          DESK_SWITCH_UPDATE_SIGNING_KEY: ${{ secrets.DESK_SWITCH_UPDATE_SIGNING_KEY }}
        run: python3 tools/ci_sign_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desk-switch-signed-metadata
          path: dist/signed/update.json
          if-no-files-found: error
          retention-days: 30

  publish:
    if: needs.request.outputs.publish == 'true'
    needs: [request, build, build-macos, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desk-switch-*
          path: artifacts
          merge-multiple: true
      - name: Publish tested installers with their verified signed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from release_assets import asset_names
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = f'v{version}'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag
          else:
              assert json.loads(Path('release/publish-request.json').read_text())['tag'] == tag
          Path('dist').mkdir(exist_ok=True)
          names = asset_names(version)
          manifest = Path(f'release/manifests/{version}.json')
          manifest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2('artifacts/update.json', manifest)
          for target, name in names.items():
              source = 'desk-switch.exe' if target == 'windows-x86_64' else name
              shutil.copy2(Path('artifacts')/source, Path('dist')/name)
          installers = [Path('dist')/name for name in names.values()]
          existing = subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{tag}'],capture_output=True,text=True)
          if existing.returncode == 0:
              info = json.loads(existing.stdout)
              assets = {asset['name']:asset for asset in info['assets']}
              assert set(assets) == set(names.values()), 'Existing release assets differ; do not overwrite them'
              ref = json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/ref/tags/{tag}'],text=True))
              assert ref['object']['sha'] == os.environ['GITHUB_SHA'], 'Existing release belongs to another source commit'
              for installer in installers:
                  data = installer.read_bytes()
                  asset = assets[installer.name]
                  assert asset['size'] == len(data) and asset['digest'] == 'sha256:'+hashlib.sha256(data).hexdigest(), 'Existing installer differs; do not replace it'
              print('The same tested release candidate already exists; keeping its installers')
          else:
              subprocess.run(['gh','release','create',tag,*map(str,installers),'--target',os.environ['GITHUB_SHA'],'--prerelease','--title',f'Desk Switch {tag}','--notes-file',f'release/notes/{version}.md'],check=True)
          PY
      - name: Publish the verified signed stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/promote_release.py
