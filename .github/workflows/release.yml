name: Release

on:
  push:
    branches: [main]
    paths: [release/publish-request.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            binary: desk-switch
            rustflags: ""
          - os: windows-2022
            platform: windows
            binary: desk-switch.exe
            rustflags: "-C target-feature=+crt-static"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev desktop-file-utils
          python3 tools/package_deb.py --binary target/release/desk-switch --out dist
          python3 tools/verify_deb.py dist/desk-switch-linux-x86_64.deb
          sudo apt-get --simulate install ./dist/desk-switch-linux-x86_64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: desk-switch-${{ matrix.platform }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
      - if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: desk-switch-debian
          path: dist/desk-switch-linux-x86_64.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desk-switch-*
          path: artifacts
          merge-multiple: true
      - name: Publish tested installers for signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = f'v{version}'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag
          else:
              assert json.loads(Path('release/publish-request.json').read_text())['tag'] == tag
          Path('dist').mkdir()
          for source, name in [('desk-switch','desk-switch-linux-x86_64'), ('desk-switch.exe','desk-switch-windows-x86_64.exe'), ('desk-switch-linux-x86_64.deb','desk-switch-linux-x86_64.deb')]:
              shutil.copy2(Path('artifacts')/source, Path('dist')/name)
          subprocess.run(['gh','release','create',tag,*map(str,Path('dist').iterdir()),'--target',os.environ['GITHUB_SHA'],'--prerelease','--title',f'Desk Switch {tag}','--notes-file',f'release/notes/{version}.md'],check=True)
          PY
