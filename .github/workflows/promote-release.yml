name: Publish signed release

on:
  push:
    branches: [main]
    paths: ["release/manifests/*.json", "tools/promote_release.py", "tools/test_promote_release.py", "tools/release_assets.py", "tools/normalize_release_assets.py", "tools/test_normalize_release_assets.py", ".github/workflows/promote-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check signed release metadata repairs
        run: |
          python3 tools/test_promote_release.py
          python3 tools/test_normalize_release_assets.py
          python3 tools/test_release_assets.py
      - name: Normalize filenames on an existing unsigned release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/normalize_release_assets.py
      - name: Locate signed metadata for the current version
        id: manifest
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          ready = Path(f'release/manifests/{version}.json').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'ready={str(ready).lower()}', file=output)
          PY
      - name: Verify signed native artifacts, then publish
        if: steps.manifest.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/promote_release.py
