name: Checks

on: [push, pull_request]

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev dpkg-dev desktop-file-utils python3-gi dbus udev openssl polkitd xvfb openbox wmctrl x11-utils libgl1-mesa-dri libxkbcommon-x11-0
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked -p rust-auto-updator --lib
      - name: Check native file clipboard on an isolated Windows runner
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          DESK_SWITCH_NATIVE_CLIPBOARD_TEST: "1"
        run: cargo test --locked group::clipboard_files::windows::tests::isolated_ci_native_file_clipboard_roundtrip -- --ignored --exact --nocapture
      - name: Check Ubuntu tray window lifecycle on an isolated desktop
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          cargo build --locked --profile diagnostic
          timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tools/test_linux_tray.py --binary target/diagnostic/desk-switch --out target/linux-tray-proof
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux' && always()
        with:
          name: ubuntu-tray-lifecycle-proof
          path: target/linux-tray-proof
          if-no-files-found: ignore
      - if: runner.os == 'Linux'
        run: |
          node tools/test_gnome_companion.mjs
          python3 tools/test_release_assets.py
          python3 tools/test_promote_release.py
          python3 tools/test_normalize_release_assets.py
          python3 tools/test_input_access.py
          python3 tools/test_update_install.py
          udevadm verify packaging/linux/99-desk-switch-input-access.rules
      - run: cargo build --locked --release
      - name: Verify native executable icons and version metadata
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: ./tools/verify_windows_icon.ps1 -Executable target/release/desk-switch.exe -ExpectedIcon assets/desk-switch.ico -PngDirectory target/windows-icon-proof
      - if: runner.os == 'Linux'
        run: /usr/bin/python3 tools/test_portal_restore.py --binary target/release/desk-switch
      - if: runner.os == 'Linux'
        run: |
          python3 tools/package_deb.py --binary target/release/desk-switch --out dist
          python3 tools/verify_deb.py dist/*.deb
          sudo apt-get --simulate install ./dist/*.deb
