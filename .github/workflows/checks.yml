name: Checks

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          shared-key: checks-${{ matrix.os }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev dpkg-dev desktop-file-utils python3-gi dbus udev openssl polkitd fuse3 xvfb openbox wmctrl x11-utils nautilus xdotool libgl1-mesa-dri libxkbcommon-x11-0
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Check Ubuntu tray window lifecycle on an isolated desktop
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          cargo build --locked --profile diagnostic
          timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tools/test_linux_tray.py --binary target/diagnostic/desk-switch --out target/linux-tray-proof
      - name: Check actual GNOME 50 tray clicks on a private virtual desktop
        if: matrix.os == 'ubuntu-26.04'
        timeout-minutes: 5
        run: |
          sudo apt-get install -y gnome-shell gnome-shell-extension-appindicator xwayland
          timeout 120s /usr/bin/python3 tools/test_gnome_tray.py --binary target/diagnostic/desk-switch --backend legacy --out target/gnome-tray-proof/legacy
          timeout 120s /usr/bin/python3 tools/test_gnome_tray.py --binary target/diagnostic/desk-switch --backend sni --out target/gnome-tray-proof/sni
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-26.04' && always()
        with:
          name: ubuntu-26-gnome-tray-proof
          path: target/gnome-tray-proof
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && always()
        with:
          name: ubuntu-tray-lifecycle-proof-${{ matrix.os }}
          path: target/linux-tray-proof
          if-no-files-found: ignore
      - run: cargo test --locked --all-features
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.os == 'ubuntu-24.04'
        with:
          distribution: temurin
          java-version: '23'
      - name: Install the pinned Android SDK packages
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 10
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Build and check the experimental Android app
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 10
        working-directory: android
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/android/.gradle-user
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --locked --manifest-path native/Cargo.toml --target-dir core/build/noise/host -- -D warnings
          bash ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --max-workers=2
      - name: Check Android against the actual desktop protocol with synthetic input
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 3
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/android/.gradle-user
        run: python3 tools/test_android_remote.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-24.04' && always()
        with:
          name: android-remote-experiment
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.*
            target/android-interop
          if-no-files-found: error
      - run: cargo test --locked -p rust-auto-updator --lib
      - name: Check real Ubuntu file paste on an isolated desktop
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: /usr/bin/python3 tools/test_linux_file_paste.py --out target/native-file-paste-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && always()
        with:
          name: ubuntu-native-file-paste-proof-${{ matrix.os }}
          path: target/native-file-paste-proof
          if-no-files-found: error
      - name: Check native file clipboard on an isolated Windows runner
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          DESK_SWITCH_NATIVE_CLIPBOARD_TEST: "1"
        run: cargo test --locked group::clipboard_files::windows::tests::isolated_ci_native_file_clipboard_roundtrip -- --ignored --exact --nocapture
      - name: Verify Windows window restore and idle rendering
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: cargo test --locked gui::software::smoke::native_two_window_lifecycle_stays_painted_and_sleeps_when_settled -- --ignored --exact --nocapture
      - name: Check native Windows file paste and recoverable Move
        if: runner.os == 'Windows'
        timeout-minutes: 7
        run: python tools/test_windows_file_paste.py --out target/windows-native-file-paste-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows' && always()
        with:
          name: windows-native-file-paste-proof
          path: target/windows-native-file-paste-proof
          if-no-files-found: error
      - if: runner.os == 'Linux'
        run: |
          node tools/test_gnome_companion.mjs
          python3 tools/test_release_assets.py
          python3 tools/test_promote_release.py
          python3 tools/test_normalize_release_assets.py
          python3 tools/test_input_access.py
          python3 tools/test_update_install.py
          udevadm verify packaging/linux/99-desk-switch-input-access.rules
      - run: cargo build --locked --release --all-features
      - name: Verify native executable icons and version metadata
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: ./tools/verify_windows_icon.ps1 -Executable target/release/desk-switch.exe -ExpectedIcon assets/desk-switch.ico -PngDirectory target/windows-icon-proof
      - if: runner.os == 'Linux'
        run: /usr/bin/python3 tools/test_portal_restore.py --binary target/release/desk-switch
      - if: runner.os == 'Linux'
        run: |
          python3 tools/package_deb.py --binary target/release/desk-switch --out dist
          python3 tools/verify_deb.py dist/*.deb
          sudo apt-get --simulate install ./dist/*.deb
      - name: Package the Ubuntu phone remote experiment
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 tools/package_deb.py --binary target/release/desk-switch --out dist/experiment --android-experiment "$GITHUB_RUN_NUMBER"
          python3 tools/verify_deb.py dist/experiment/*.deb --android-experiment "$GITHUB_RUN_NUMBER"
          sudo apt-get --simulate install ./dist/experiment/*.deb
      - name: Prepare the Windows experiment for manual testing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/experiment -Force | Out-Null
          Copy-Item -LiteralPath target/release/desk-switch.exe -Destination dist/experiment/DeskSwitch-v0.11.3-android-experiment.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: windows-phone-remote-experiment
          path: dist/experiment/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: ubuntu-phone-remote-experiment
          path: dist/experiment/*.deb
          if-no-files-found: error
