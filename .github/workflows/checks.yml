name: Checks

on: [push, pull_request]

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev dpkg-dev desktop-file-utils python3-gi dbus udev openssl polkitd
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'Linux'
        run: |
          python3 tools/test_input_access.py
          python3 tools/test_update_install.py
          udevadm verify packaging/linux/99-desk-switch-input-access.rules
      - run: cargo build --locked --release
      - if: runner.os == 'Linux'
        run: /usr/bin/python3 tools/test_portal_restore.py --binary target/release/desk-switch
      - if: runner.os == 'Linux'
        run: |
          python3 tools/package_deb.py --binary target/release/desk-switch --out dist
          python3 tools/verify_deb.py dist/*.deb
          sudo apt-get --simulate install ./dist/*.deb
