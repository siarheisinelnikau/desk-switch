name: Android prerelease

on:
  push:
    tags:
      - 'android-remote-v*'

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'siarheisinelnikau/desk-switch' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      code: ${{ steps.metadata.outputs.code }}
      unsigned-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Android release tag and source version
        id: metadata
        run: |
          version="${GITHUB_REF_NAME#android-remote-v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gradle_file=android/app/build.gradle.kts
          code=$(sed -nE 's/^[[:space:]]*versionCode = ([1-9][0-9]*)$/\1/p' "$gradle_file")
          name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' "$gradle_file")
          [[ "$code" =~ ^[1-9][0-9]*$ && "$name" == "$version-experimental" ]]
          test -s "android/release/$version.md"
          printf 'version=%s\ncode=%s\n' "$version" "$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '23'
      - name: Install Android SDK and protocol test dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev
      - name: Check Android and build the unsigned release APK
        working-directory: android
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/android/.gradle-user
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --locked --manifest-path native/Cargo.toml --target-dir core/build/noise/host -- -D warnings
          bash ./gradlew :core:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon --max-workers=2
      - name: Check Android against the desktop protocol
        env:
          CARGO_BUILD_JOBS: '2'
          GRADLE_USER_HOME: ${{ github.workspace }}/android/.gradle-user
        run: python3 tools/test_android_remote.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-release
    permissions:
      contents: read
    outputs:
      signed-id: ${{ steps.upload.outputs.artifact-id }}
      apk-sha256: ${{ steps.verify.outputs.sha256 }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      VERSION_CODE: ${{ needs.build.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.unsigned-id }}
          path: unsigned
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '23'
      - name: Install Android Build Tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Inspect and align the unsigned APK
        run: |
          apk=unsigned/app-release-unsigned.apk
          python3 android/release/verify_apk.py "$apk" "$VERSION" "$VERSION_CODE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/android-aligned.apk"
      - name: Sign the aligned APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing Android keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing Android keystore password secret}"
          [[ "$ANDROID_KEYSTORE_BASE64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$ANDROID_KEYSTORE_PASSWORD" != *$'\n'* && "$ANDROID_KEYSTORE_PASSWORD" != *$'\r'* ]]
          printf '::add-mask::%s\n' "$ANDROID_KEYSTORE_BASE64" "${ANDROID_KEYSTORE_PASSWORD//%/%25}"
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/android-keystore.XXXXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset ANDROID_KEYSTORE_BASE64
          mkdir -p signed
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias deskswitch-remote \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --v4-signing-enabled false \
            --out "signed/DeskSwitchRemote-v$VERSION-experimental.apk" "$RUNNER_TEMP/android-aligned.apk"
      - name: Verify the APK metadata, alignment and pinned signing certificate
        id: verify
        run: |
          apk="signed/DeskSwitchRemote-v$VERSION-experimental.apk"
          python3 android/release/verify_apk.py "$apk" "$VERSION" "$VERSION_CODE" --verify-signature
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          checksum=$(sha256sum "$apk")
          printf 'sha256=%s\n' "${checksum%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: android-signed
          path: signed/DeskSwitchRemote-v${{ env.VERSION }}-experimental.apk
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: android/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.signed-id }}
          path: signed
      - name: Publish the Android prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          APK_SHA256: ${{ needs.sign.outputs.apk-sha256 }}
        run: |
          apk="signed/DeskSwitchRemote-v$VERSION-experimental.apk"
          printf '%s  %s\n' "$APK_SHA256" "$apk" | sha256sum --strict --check
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "Desk Switch Remote $VERSION (experimental)" --notes-file "android/release/$VERSION.md"
