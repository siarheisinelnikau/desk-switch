[package]
name = "desk-switch-noise"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = { version = "=0.22.4", default-features = false }
snow = { version = "=0.10.0", default-features = false, features = ["use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
zeroize = "1"

[profile.release]
lto = "thin"
strip = "symbols"
