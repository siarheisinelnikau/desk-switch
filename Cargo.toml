[package]
name = "desk-switch"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Share monitors, input and audio across Windows, Ubuntu and macOS computers"

[dependencies]
rust-auto-updator = { path = "vendor/rust-auto-updator" }
mdns-sd = "=0.21.4"
flume = "0.12"
socket2 = "0.6"
anyhow = "1.0"
base64 = "0.22"
arboard = { version = "3.6", features = ["image-data"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts"] }
serde_json = "1.0"
ed25519-dalek = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1.0"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
snow = { version = "0.10", default-features = false, features = ["use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "=6.0.0"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml = "0.9"
tokio = { version = "1.48", features = ["rt", "macros", "net", "sync", "time", "io-util", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "blocking-api"] }
eframe = { version = "0.35", default-features = false, features = ["glow", "x11", "wayland"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }
libc = "0.2"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
futures-util = "0.3"
evdev = { version = "0.13", features = ["tokio"] }
reis = { version = "0.7", features = ["tokio"] }
rustix = { version = "1.1", features = ["time", "process"] }
ksni = { version = "0.3.6", features = ["blocking"] }
x11rb = { version = "=0.13.2", features = ["xfixes"] }
tokio = { version = "1.48", features = ["process"] }

[target.'cfg(windows)'.dependencies]
egui-winit = { version = "=0.35.0", default-features = false, features = ["clipboard", "links"] }
egui_software_backend = { path = "vendor/egui_software_backend", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
bytemuck = "1"
tray-icon = { version = "0.25", default-features = false }
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow"] }
libc = "0.2"
tokio = { version = "1.48", features = ["process"] }
tray-icon = { version = "0.25", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSEvent", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.diagnostic]
inherits = "release"
debug-assertions = true
strip = false

[profile.dev.package.egui_software_backend]
opt-level = 3
